# Local infra for the gateway. `docker compose up -d` then `npm run db:init`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dailynutry
      POSTGRES_PASSWORD: dailynutry
      POSTGRES_DB: dailynutry
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  pgdata:
