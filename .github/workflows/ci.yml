name: CI

# ─── Por que as actions estão fixadas por SHA ────────────────────────────────
# `@v4` é uma tag MUTÁVEL: quem controla o repositório da action pode reapontá-la
# para qualquer commit, e todo mundo que usa a tag passa a rodar o novo código na
# próxima execução — com acesso aos secrets do workflow. É a mesma classe de
# ataque que o `.npmrc` deste projeto trata com `save-exact=true`, e actions
# rodam com MAIS privilégio que uma dependência de build.
#
# O SHA é imutável. O comentário ao lado diz qual versão ele é, para a leitura
# não virar hexadecimal sem sentido.
#
# Para atualizar: pegue o SHA novo com
#   git ls-remote --tags https://github.com/<owner>/<repo>.git
# e troque também o comentário. Não volte para a tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR instead of racing them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway

    # Real Postgres, because the integration suite exists precisely to cover
    # what mocking hides: both bugs that reached a running server lived in SQL,
    # and one of them had a PASSING unit test asserting the wrong number.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dailynutry
          POSTGRES_PASSWORD: dailynutry
          POSTGRES_DB: dailynutry
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dailynutry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://dailynutry:dailynutry@localhost:5432/dailynutry

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-gateway/package-lock.json

      # npm ci honours ai-gateway/.npmrc (ignore-scripts, save-exact) — a
      # compromised dependency's install script never runs, even in CI.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run db:init
      - run: npm run test:integration

      - run: npm run build
      - run: npm run supply-chain

  dailynutry-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dailynutry-app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dailynutry-app/package-lock.json

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run supply-chain

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # Mermaid aceita declarar um nó pelado e rotulá-lo depois, e os
      # renderizadores discordam sobre qual rótulo vale. O do GitHub mantém a
      # primeira aparição, então o diagrama já foi publicado com três caixas
      # mostrando o identificador cru. Sem dependências: é só Node.
      - run: node scripts/check-mermaid.mjs
